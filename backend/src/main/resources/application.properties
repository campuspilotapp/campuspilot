spring.application.name=CampusPilot

server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=${DB_SSL_MODE:REQUIRED}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 * * * * *
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CAMPUSPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:}
app.mail.host=${MAIL_HOST:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.bootstrap.enabled=${BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
app.bootstrap.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
